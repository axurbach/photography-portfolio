<!doctype html>
<html lang="en">
    <head>
        <!-- document metadata -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Page not found - Alexander Urbach</title>

        <!-- legacy route redirect -->
        <script>
            if (/^\/collections(?:\/|$)/i.test(window.location.pathname)) {
                window.location.replace("/");
            }
        </script>
    </head>
    <body>
        <!-- error message -->
        <h1>Page not found</h1>
        <p>Sorry, that page does not exist. Return to the <a href="/">homepage</a>.</p>
    </body>
</html>

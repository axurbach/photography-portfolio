        <!-- contact form -->
        <main class="content-main contact-main" id="contact">
            <section class="contact-copy">
                <h1 class="sr-only">Contact</h1>
                <img
                    class="contact-image"
                    src="../images/contact.jpg"
                    alt="Photography studio with lighting equipment and a backdrop"
                >
                <form id="contact-form" class="contact-form" novalidate>
                    <div class="contact-fields">
                        <label>
                            <span>Name</span>
                            <input
                                name="name"
                                type="text"
                                autocomplete="name"
                                placeholder="Your name"
                                required
                                maxlength="120"
                            >
                        </label>
                        <label>
                            <span>Email</span>
                            <input
                                name="email"
                                type="email"
                                autocomplete="email"
                                placeholder="Your email"
                                required
                                maxlength="254"
                            >
                        </label>
                        <label class="message-field">
                            <span>Message</span>
                            <textarea
                                name="message"
                                rows="5"
                                placeholder="Your message"
                                required
                                maxlength="5000"
                            ></textarea>
                        </label>
                    </div>
                    <div class="contact-actions">
                        <button class="submit-button" type="submit">Send</button>
                        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                    </div>
                </form>
                <p class="contact-email">
                    Or email <a href="mailto:axurbach@gmail.com">axurbach@gmail.com</a>
                </p>
            </section>
